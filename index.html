<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猕猴桃日记</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #333; background: #fafafa; line-height: 1.8;
      display: flex; justify-content: center; min-height: 100vh;
    }
    .container { width: 100%; max-width: 640px; padding: 48px 24px 80px; }

    /* ↓↓↓ 封面页 ↓↓↓ */
    .cover {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .cover-inner {
      display: flex;
      gap: 28px;
      align-items: center;
    }
    .cover-inner img {
      width: 220px; height: 220px;
      object-fit: cover;
      border-radius: 16px;
      flex-shrink: 0;
    }
    .cover-text { font-size: 15px; color: #555; line-height: 2.1; }
    .enter-btn {
      margin-top: 48px;
      align-self: center;
      border: 1px solid #ddd;
      background: #fff;
      color: #666;
      font-size: 15px;
      padding: 10px 32px;
      border-radius: 24px;
      cursor: pointer;
    }
    .enter-btn:hover { background: #f5f5f5; color: #222; }
    @media (max-width: 560px) {
      .cover-inner { flex-direction: column; text-align: center; }
      .cover-inner img { width: 170px; height: 170px; }
    }

    /* ↓↓↓ 日记页 ↓↓↓ */
    .diary { display: none; }        /* 初始隐藏，点进入后显示 */
    .date { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #222; }

    .gallery { margin-bottom: 24px; }
    .stage {
      position: relative; width: 100%; height: 400px;
      background: #f0f0f0; border-radius: 8px; overflow: hidden;
      display: flex; justify-content: center; align-items: center;
    }
    .stage img {
      max-width: 100%; max-height: 100%; display: block;
      transition: transform 0.15s ease; transform-origin: center center;
      user-select: none; -webkit-user-drag: none;
    }
    .stage img.zoomed { cursor: grab; }
    .stage img.dragging { cursor: grabbing; transition: none; }

    .img-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: rgba(0,0,0,0.4); color: #fff; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .img-nav:hover { background: rgba(0,0,0,0.6); }
    .img-prev { left: 8px; }
    .img-next { right: 8px; }

    .dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; }
    .dot.active { background: #666; }

    .zoom-bar { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
    .zoom-bar button {
      width: 32px; height: 32px; border: 1px solid #ddd; background: #fff;
      border-radius: 6px; font-size: 16px; color: #666; cursor: pointer;
    }
    .zoom-bar button:hover { background: #f5f5f5; }

    .text { font-size: 16px; color: #444; margin-bottom: 48px; white-space: pre-wrap; }
    .nav { display: flex; justify-content: space-between; align-items: center; }
    .nav button {
      border: none; background: none; font-size: 16px; color: #999;
      cursor: pointer; padding: 8px 4px;
    }
    .nav button:hover:not(:disabled) { color: #222; }
    .nav button:disabled { opacity: 0.3; cursor: default; }
    .counter { font-size: 14px; color: #bbb; }

    .back-btn {
      display: block; margin: 32px auto 0;
      border: none; background: none; color: #bbb; font-size: 14px; cursor: pointer;
    }
    .back-btn:hover { color: #666; }
  </style>
</head>
<body>
  <div class="container">
<!---->
    <!-- ===== 封面页 ===== -->
    <div class="cover" id="cover">
      <div class="cover-inner">
        <img src="images/cover.jpg" alt="猕猴桃">
        <div class="cover-text">
          喵！大家好，我是猕猴桃，是生活在华南农大数信学院的一个可爱小猫，我特别喜欢和人人玩，但我近期不慎被发现患有落叶型天疱疮QAQ，但没关系喵喵喵，我现在正在勇敢地反落叶型天疱疮！如果你喜欢我，可不可以多点来看望我，喵喵喵，人，想要你的关注和陪伴！

</div>


      </div>
      <button class="enter-btn" id="enterBtn">进入日记</button>
    </div>

    <!-- ===== 日记页 ===== -->
    <div class="diary" id="diary">
      <div class="date" id="date"></div>

      <div class="gallery">
        <div class="stage" id="stage">
          <button class="img-nav img-prev" id="imgPrev">‹</button>
          <img id="stageImg" src="" alt="">
          <button class="img-nav img-next" id="imgNext">›</button>
        </div>
        <div class="dots" id="dots"></div>
        <div class="zoom-bar">
          <button id="zoomOut">−</button>
          <button id="zoomReset">↺</button>
          <button id="zoomIn">＋</button>
        </div>
      </div>

      <div class="text" id="text"></div>

      <div class="nav">
        <button id="prev">上一日</button>
        <span class="counter" id="counter"></span>
        <button id="next">下一日</button>
      </div>

      <button class="back-btn" id="backBtn">返回封面</button>
    </div>

  </div>

  <script src="data.js"></script>
  <script>
    let dayIndex = 0;              // ★ 从最早一天开始（0 = 第一天）
    let imgIndex = 0;
    let scale = 1, tx = 0, ty = 0;
    const MIN_SCALE = 1, MAX_SCALE = 3, STEP = 0.5;

    const cover    = document.getElementById("cover");
    const diaryEl  = document.getElementById("diary");
    const stage    = document.getElementById("stage");
    const stageImg = document.getElementById("stageImg");
    const dotsBox  = document.getElementById("dots");

    // 进入 / 返回
    document.getElementById("enterBtn").onclick = () => {
      cover.style.display = "none";
      diaryEl.style.display = "block";
      dayIndex = 0;               // 进入时从最早一天开始
      renderDay();
    };
    document.getElementById("backBtn").onclick = () => {
      diaryEl.style.display = "none";
      cover.style.display = "flex";
      window.scrollTo(0, 0);
    };

    function renderDay() {
      const d = diary[dayIndex];
      document.getElementById("date").textContent = d.date;
      document.getElementById("text").textContent = d.text;
      document.getElementById("counter").textContent = (dayIndex + 1) + " / " + diary.length;
      document.getElementById("prev").disabled = (dayIndex === 0);
      document.getElementById("next").disabled = (dayIndex === diary.length - 1);
      imgIndex = 0;
      renderImage();
      renderDots();
      window.scrollTo(0, 0);
    }

    function renderImage() {
      const imgs = diary[dayIndex].images;
      stageImg.src = imgs[imgIndex];
      resetZoom();
      const many = imgs.length > 1;
      document.getElementById("imgPrev").style.display = many ? "flex" : "none";
      document.getElementById("imgNext").style.display = many ? "flex" : "none";
      dotsBox.style.display = many ? "flex" : "none";
      updateDots();
    }

    function renderDots() {
      const imgs = diary[dayIndex].images;
      dotsBox.innerHTML = imgs.map(() => `<span class="dot"></span>`).join("");
      updateDots();
    }
    function updateDots() {
      [...dotsBox.children].forEach((dot, k) => dot.classList.toggle("active", k === imgIndex));
    }

    function applyTransform() {
      stageImg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      stageImg.classList.toggle("zoomed", scale > 1);
    }
    function resetZoom() { scale = 1; tx = 0; ty = 0; applyTransform(); }
    function clampPan() {
      const rect = stage.getBoundingClientRect();
      const maxX = (rect.width  * (scale - 1)) / 2;
      const maxY = (rect.height * (scale - 1)) / 2;
      tx = Math.max(-maxX, Math.min(maxX, tx));
      ty = Math.max(-maxY, Math.min(maxY, ty));
    }

    document.getElementById("prev").onclick = () => { if (dayIndex > 0) { dayIndex--; renderDay(); } };
    document.getElementById("next").onclick = () => { if (dayIndex < diary.length - 1) { dayIndex++; renderDay(); } };
    document.getElementById("imgPrev").onclick = () => {
      const n = diary[dayIndex].images.length; imgIndex = (imgIndex - 1 + n) % n; renderImage();
    };
    document.getElementById("imgNext").onclick = () => {
      const n = diary[dayIndex].images.length; imgIndex = (imgIndex + 1) % n; renderImage();
    };
    document.getElementById("zoomIn").onclick  = () => { scale = Math.min(MAX_SCALE, scale + STEP); clampPan(); applyTransform(); };
    document.getElementById("zoomOut").onclick = () => { scale = Math.max(MIN_SCALE, scale - STEP); clampPan(); applyTransform(); };
    document.getElementById("zoomReset").onclick = () => resetZoom();

    // 拖拽
    let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
    stageImg.addEventListener("mousedown", (e) => {
      if (scale <= 1) return;
      dragging = true; startX = e.clientX; startY = e.clientY; startTx = tx; startTy = ty;
      stageImg.classList.add("dragging"); e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      tx = startTx + (e.clientX - startX); ty = startTy + (e.clientY - startY);
      clampPan(); applyTransform();
    });
    window.addEventListener("mouseup", () => { dragging = false; stageImg.classList.remove("dragging"); });
    stageImg.addEventListener("touchstart", (e) => {
      if (scale <= 1) return;
      dragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; startTx = tx; startTy = ty;
    }, {passive: true});
    stageImg.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      tx = startTx + (e.touches[0].clientX - startX); ty = startTy + (e.touches[0].clientY - startY);
      clampPan(); applyTransform();
    }, {passive: true});
    stageImg.addEventListener("touchend", () => { dragging = false; });
    stageImg.addEventListener("dblclick", () => {
      if (scale > 1) resetZoom(); else { scale = 2; applyTransform(); }
    });
  </script>
</body>
</html>
